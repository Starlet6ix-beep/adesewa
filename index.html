<!DOCTYPE html>
<html>
<head>

<title>Happy Birthday Adesewa 🎉</title>

<style>

body{
font-family: Arial, sans-serif;
background: linear-gradient(135deg,#ff9a9e,#fad0c4);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
margin:0;
}

.card{
background:white;
padding:40px;
border-radius:15px;
box-shadow:0 10px 30px rgba(0,0,0,0.2);
max-width:650px;
}

h1{
color:#ff4081;
}

#countdown{
font-size:20px;
margin-top:10px;
color:#444;
}

</style>

</head>

<body>

<div class="card">

<h1>🎉 Happy Birthday Adesewa 🎉</h1>

<p id="countdown"></p>

<p id="message"></p>

</div>

<script>

// SET THE UNLOCK TIME
var unlockTime = new Date("March 16, 2026 00:00:00").getTime();

var message = `Life is indeed funny, one minute we were just chatting like we always do on Snap, like it was a norm, like it was a routine, Tipsy Adesewa and her thing for shawarma, and before we know it, life has just gradually taken us to where we are right now, going separate ways.

Even though it has been a while since we last chatted like we used to, I still appreciate the good vibes we always shared during the course of our Snap chats.

Though most online relationships start randomly, yet still manage to mean something in their own way.

I just wanted to take a moment to wish you a genuinely happy birthday.

Hope life has been treating you well so far, hope your new year brings growth, peace of mind and success in whatever journey you are right now.

Enjoy your day and celebrate yourself ✨`


// COUNTDOWN
var timer = setInterval(function(){

var now = new Date().getTime();
var distance = unlockTime - now;

if(distance < 0){

clearInterval(timer);

document.getElementById("countdown").innerHTML="";

typeMessage();

launchConfetti();

}else{

var hours = Math.floor((distance % (1000*60*60*24))/(1000*60*60));
var minutes = Math.floor((distance % (1000*60*60))/(1000*60));
var seconds = Math.floor((distance % (1000*60))/1000);

document.getElementById("countdown").innerHTML =
"🎁 Unlocks in " + hours + "h " + minutes + "m " + seconds + "s";

}

},1000);


// TYPING EFFECT
function typeMessage(){

let i=0;

function typing(){

if(i < message.length){

document.getElementById("message").innerHTML += message.charAt(i);

i++;

setTimeout(typing,30);

}

}

typing();

}


// CONFETTI
function launchConfetti(){

for(let i=0;i<120;i++){

let confetti=document.createElement("div");

confetti.style.position="fixed";
confetti.style.width="10px";
confetti.style.height="10px";
confetti.style.background="hsl("+Math.random()*360+",100%,50%)";
confetti.style.top="-10px";
confetti.style.left=Math.random()*100+"%";
confetti.style.opacity="0.8";
confetti.style.transform="rotate("+Math.random()*360+"deg)";

document.body.appendChild(confetti);

let fall=Math.random()*3+2;

confetti.animate([
{transform:"translateY(0px)"},
{transform:"translateY(100vh)"}
],
{duration:fall*1000,iterations:1});

}

}

</script>

</body>
</html>
